version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: your_db_name
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://your_username:your_password@postgres:5432/your_db_name
      OPENAI_API_KEY: $OPENAI_API_KEY
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
